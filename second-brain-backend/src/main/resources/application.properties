# ─── Supabase PostgreSQL ─────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.${SUPABASE_PROJECT_REF}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA ─────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# ─── Spring MVC ───────────────────────────────────────────────────────────────
spring.mvc.pathmatch.matching-strategy=ant-path-matcher

# ─── File Upload Limits ───────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# ─── JWT ─────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000
jwt.refresh-expiration-days=7

# ─── Supabase Storage ────────────────────────────────────────────────────────
supabase.url=${SUPABASE_URL}
supabase.service-key=${SUPABASE_SERVICE_KEY}
supabase.storage.bucket=second-brain-files